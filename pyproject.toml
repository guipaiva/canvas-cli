[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "canvas-cli"
version = "0.1.0"
description = "A generic Canvas LMS CLI for teachers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "markdown>=3.5",
  "python-dotenv>=1.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
canvas = "canvas_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
